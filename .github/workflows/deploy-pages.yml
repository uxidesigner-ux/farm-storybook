name: Deploy Storybook (manual)

# 수동 실행 전용. 승인된 dev 브랜치만 GitHub Pages에 게시한다.
# GitHub Pages 사이트는 저장소가 비공개여도 주소를 아는 누구나 볼 수 있다(Enterprise 비공개 Pages 제외).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '외부 공개에 동의하면 "publish"를 입력'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/dev' && inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run verify:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
